<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
<style>
  body {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

.card-list {
  display: flex;      /* ← 이게 있어야 카드들이 가로로 나열됨 */
  gap: 12px;
}
    
  
</style>
</head>
<body>

  <!-- 여기에 my-card 태그를 title, desc 속성 넣어서 2~3개 써보세요 -->
  <div class="card-list">
  <my-card title="HTML" desc="웹의 뼈대를 만드는 마크업 언어"></my-card>
  <my-card title="CSS" desc="웹을 꾸미는 스타일 언어"></my-card>
  <my-card title="JavaScript" desc="웹에 동작을 더하는 언어"></my-card>
</div>

  <!-- 여기에 script 태그로 js/MyCard.js 연결하기, type="module" 잊지 마세요 -->
  <script type="module">
  class MyCard extends HTMLElement {
    constructor() {
      super();
      const shadow = this.attachShadow({ mode: 'open' });
      const wrapper = document.createElement('div');
      wrapper.setAttribute('class', 'card');

      const title = document.createElement('h2');
      title.textContent = this.getAttribute('title');

      const desc = document.createElement('p');           // ← 이 줄 추가
desc.textContent = this.getAttribute('desc');   
      const hint = document.createElement('p');
hint.textContent = '↑ 클릭하면 숫자 증가';
hint.setAttribute('class', 'hint');  // 스타일 따로 주려고 클래스 이름 붙임
      // ↓ 여기부터 새로 추가할 부분
      const btn = document.createElement('button');
      let count = 0;
      btn.textContent = `♥ 좋아요 ${count}`;

      btn.addEventListener('click', () => {
        // count 증가시키고 btn.textContent 다시 설정하는 코드
        // 직접 써보세요!
        count++;
        btn.textContent = `♥ 좋아요 ${count}`;

      });
      // ↑ 여기까지

      wrapper.appendChild(title);
wrapper.appendChild(desc);
wrapper.appendChild(btn);
wrapper.appendChild(hint);   // ← 이 줄 추가
shadow.appendChild(wrapper);

      const style = document.createElement('style');
      style.textContent = `
      .card {
        background: #f5f5f5;
        border-radius: 12px;
        padding: 20px;
        width: 200px;
      }
      h2 {
        font-size: 16px;
        margin: 0 0 4px 0;
      }
      p {
        font-size: 13px;
        color: #666;
        margin: 0 0 12px 0;
      }
      button {
        background: #4a7dfc;
        color: white;
        border: none;
        border-radius: 20px;
        padding: 8px 16px;
        cursor: pointer;
        font-size: 14px;
      }

      .hint {
  font-size: 11px;
  color: #999;
  margin: 6px 0 0 0;
}
    `;
      shadow.appendChild(style);
    }
  }

  customElements.define("my-card", MyCard);  // 이 줄 꼭 필요해요!
</script>

</body>
</html>
