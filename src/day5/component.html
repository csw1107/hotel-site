<!DOCTYPE html>
<html lang="ko">
    
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script type="module" src="./MyHeader.js"></script>
  <script type="module" src="./MyFooter.js"></script>
  <title>조수원 포트폴리오</title>
  <style>
   
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #fafafa;
      color: #333;
      line-height: 1.6;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* 헤더 (이름 부분) */
    header {
      background-color: #2c3e50;
      color: white;
      padding: 40px 24px;
      text-align: center;
    }
    header h1 { font-size: 28px; }
    header p { color: rgba(255,255,255,0.75); }

    /* 메뉴 (소개·기술·연락처) */
    nav { background-color: #34495e; }
    nav ul {
      list-style: none;
      display: flex;
      justify-content: center;
      padding: 12px 24px;
    }
    nav li { margin: 0 8px; }
    nav a {
      color: white;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 6px;
      display: inline-block;
      transition: background-color 0.2s;   /* 부드럽게 색 변화 */
    }
    nav a:hover {
      background-color: rgba(255,255,255,.15);  /* 마우스 올리면 살짝 밝아짐 */
    }

    /* 본문 카드들 */
    main { padding: 40px 24px; }
    section {
      background-color: white;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      padding: 28px 32px;
      margin-bottom: 24px;
    }

    /* 제목(소개/기술/연락처) 밑에 파란 장식선 */
    .section-title {
      position: relative;       /* 장식선이 붙을 기준점 */
      display: inline-block;
      margin-bottom: 20px;
    }
    .section-title::after {
      content: "";              /* 가짜 요소 만들기 */
      position: absolute;
      bottom: -4px; left: 0;
      width: 100%; height: 2px;
      background: #4a90e2;      /* 파란 막대 */
    }

    /* 기술 카드 3개 (HTML·CSS·JavaScript) */
    .skill-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }
    .skill-card {
      background-color: #f7f8fa;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 20px;
      transition: transform 0.2s ease-out, box-shadow 0.2s;  /* 부드럽게 변화 */
    }
    .skill-card:hover {
      transform: translateY(-4px);              /* 위로 살짝 뜨기 */
      box-shadow: 0 8px 24px rgba(0,0,0,.12);    /* 그림자 진해지기 */
    }
    .skill-card h3 { margin-bottom: 8px; color: #2c3e50; }
    .skill-card p { font-size: 14px; color: #666; }

    footer {
      background-color: #2c3e50;
      color: rgba(255,255,255,0.7);
      text-align: center;
      padding: 24px;
    }
  </style>
</head>
<body>
    <my-header></my-header>
     

  <header>
    <div class="container">
      <h1>조수원</h1>
      <p>Frontend Developer</p>
    </div>
  </header>

  <nav>
    <ul>
      <li><a href="#about">소개</a></li>
      <li><a href="#skills">기술</a></li>
      <li><a href="#contact">연락처</a></li>
    </ul>
  </nav>

  <main>
    <div class="container">
      <section id="about">
        <h2 class="section-title">소개</h2>
        <p>안녕하세요. 저는 프론트엔드를 배우는 예비 개발자 조수원입니다.</p>
      </section>

      <section id="skills">
        <h2 class="section-title">기술</h2>
        <div class="skill-list">
          <div class="skill-card">
            <h3>HTML</h3>
            <p>웹페이지의 뼈대를 만드는 마크업 언어입니다.</p>
          </div>
          <div class="skill-card">
            <h3>CSS</h3>
            <p>색상, 배치, 디자인을 담당하는 스타일 언어입니다.</p>
          </div>
          <div class="skill-card">
            <h3>JavaScript</h3>
            <p>웹에 동작과 상호작용을 더하는 언어입니다.</p>
          </div>
        </div>
      </section>

      <section id="contact">
        <h2 class="section-title">연락처</h2>
        <p>이메일: example@email.com</p>
      </section>
    </div>
  </main>

  <footer>
    <p>© 2026 조수원. All rights reserved.</p>
  </footer>
<my-footer></my-footer>
</body>
</html>
