<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
            body {
        padding: 40px;
        font-family: sans-serif;
        }

        /* 버튼+메뉴 감싸는 상자 */
        .dropdown {
        position: relative;
        display: inline-block;
        }

        #toggle {
        padding: 10px 18px;
        border: none;
        background: #4a90e2;
        color: white;
        border-radius: 8px;
        cursor: pointer;
        font-size: 15px;
        }

        /* 메뉴 목록 — 평소엔 숨김 */
        .menu {
        position: absolute;
        top: 100%; left: 0;
        display: none;              /* ← 핵심! 평소엔 안 보임 */
        list-style: none;
        padding: 6px 0;
        margin: 4px 0 0;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        background: #fff;
        min-width: 120px;
        }

        /* open 스티커 붙으면 보임 */
        .menu.open {
        display: block;             /* ← 핵심! */
        }

        .menu li {
        padding: 10px 18px;
        cursor: pointer;
        }
        .menu li:hover {
        background: #f0f2f5;
        }
    </style>
</head>
<body>
    <div class="dropdown">
  <button id="toggle">메뉴 ▾</button>
  <ul id="menu" class="menu">
    <li>프로필</li>
    <li>설정</li>
    <li>로그아웃</li>
  </ul>
</div>
<script>
  const toggle = document.getElementById("toggle");
  const menu = document.getElementById("menu");

  toggle.addEventListener("click", function() {
   menu.classList.toggle("open");
  });

  document.addEventListener("click", function(e) {
  if (!e.target.closest(".dropdown")) {
    menu.classList.remove("open");   // 바깥이면 → 스티커 떼서 닫기
  }
});
</script>    
</body>
</html>
