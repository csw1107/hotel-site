<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* [수정] 전체 화면 가운데 정렬 */
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 40px;
            color: #333;
            
            /* 수평/수직 가운데 정렬 설정 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh; /* 화면 높이에 맞게 정렬 */
        }

        /* 큰 제목 */
        h1 {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 40px;
            text-align: center; /* 제목도 가운데 정렬 */
            width: 100%;
        }

        /* 메인 컨테이너 */
        .container {
            display: flex;
            gap: 40px;
            align-items: flex-start;
        }

        /* [왼쪽] 투두리스트 카드 박스 */
        .todo {
            width: 300px;
            background-color: #f4f6f9;
            padding: 24px;
            border-radius: 8px;
        }

        /* 입력창 폼 */
        .form {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
        }

        /* 입력창 */
        #text {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }

        /* 추가 버튼 */
        #add {
            padding: 8px 14px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        /* 할 일 목록 */
        #list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        /* 할 일 개별 항목 */
        #list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: white;
            padding: 10px 14px;
            border: 1px solid #e5e7eb;
            border-radius: 4px;
            margin-top: 8px;
            font-size: 14px;
            cursor: pointer;
           
        }

        /* 완료된 항목 (전체 취소선 및 흐리게) */
        .done .label,
        .done .del {
            text-decoration: line-through;
            color: #bbb;
        }

        /* X 기호 스타일 (버튼이 아니라 텍스트처럼 다루기 위해 변경) */
        .del {
            border: none;       /* 기본 테두리 제거 */
            background: none;   /* 기본 회색 배경색 제거 */
            color: #ef4444;     /* 빨간색 글씨 지정 */
            font-size: 14px;
            padding: 0 4px;
            cursor: pointer;    /* 마우스를 올렸을 때 손가락 모양 표시 */
            outline: none;      /* 클릭 시 생기는 파란 테두리 방지 */
        }
        /* [오른쪽] 기능 설명 영역 */
        .info-section {
            width: 450px;
        }

        .info-title {
            font-size: 14px;
            color: #888;
            margin-bottom: 8px;
        }

        .info-table {
            width: 100%;
            border-collapse: collapse;
        }

        .info-table th {
            border-top: 2px solid #333;
            height: 10px;
            padding: 0;
        }

        .info-table td {
            padding: 16px 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 15px;
        }

        .info-table td.concept {
            font-family: monospace;
            color: #000;
            font-weight: 500;
        }
        
        .info-table td.desc {
            color: #666;
        }

        .info-footer {
            margin-top: 16px;
            font-size: 14px;
            color: #aaa;
        }

        #count {
    font-size: 13px;
    color: #888;
    text-align: left;   /* 오른쪽 정렬 */
    margin: 12px 0 0 0;
}

.bottom {
    display: flex;
    justify-content: space-between;  
    align-items: center;
}
.clear-btn {
    background-color: rgb(247, 242, 242);
    color: #888;
    border: 1px solid #ddd;
    border-radius: 4px;
    padding: 6px 10px;
    font-size: 13px;
    cursor: pointer;
}
#empty {
    text-align: center;
    color: #aaa;
    font-size: 14px;
    margin-top: 16px;
}
#title {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 20px;
}

    </style>
</head>
<body>
    
    <div class="todo">
    <div id="title">할 일 목록</div>
    <div class="form">

        <input id="text" placeholder="할 일을 입력하세요">
        <button id="add">추가</button>
        
    </div>
    <ul id="list"></ul> <!-- 비워둔다 -->
    
    
    <div class="bottom">
        <p id="count">완료 0 / 전체 0</p>
        <div>
        <button id="clear-done" class="clear-btn">완료 삭제</button>
        <button id="clear-all" class="clear-btn">전체 삭제</button>
        </div>
        
    </div>
    <p id="empty">할 일이 없습니다</p> 
<script>
    const text = document.querySelector("#text");
const list = document.querySelector("#list");
const empty = document.querySelector("#empty");

function createLi(value) {
    const li = document.createElement("li");
    const label = document.createElement("span");
    label.className = "label"; label.textContent = value;
    const del = document.createElement("button");
    del.className = "del"; del.textContent = "x";
    li.append(label, del); // 한 번에 추가
    return li;
}

// [추가 동작] 3줄을 함수로 묶어둠 (재료)
function addTodo() {
    if (text.value.trim() === "") return; // 빈값 무시
    list.appendChild(createLi(text.value)); // 목록에 추가
    text.value = ""; // 입력창 비우기
    updateCount(); // 카운트 업데이트
}


// 버튼 클릭 → addTodo 실행
document.querySelector("#add").addEventListener("click", addTodo);

// 입력창에서 Enter → addTodo 실행
text.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
        addTodo();
    }
});

// 목록 클릭 → 삭제 또는 완료 토글 (기존 그대로)
list.addEventListener("click", function(e) {
    const li = e.target.closest("li");
    if (!li) return;

    if (e.target.classList.contains("del")) {
        li.remove(); // 삭제 버튼 → 항목 제거
        updateCount(); // 카운트 업데이트
    } else {
        li.classList.toggle("done"); // 그 외 → 완료 토글
        updateCount(); // 카운트 업데이트
    }
});
const count = document.querySelector("#count");

function updateCount() {
     const total = list.querySelectorAll("li").length;
    const done = list.querySelectorAll("li.done").length;
    count.textContent = `완료 ${done} / 전체 ${total}`;

    if (total === 0) {
        empty.style.display = "block";  // 없으면 보이기
    } else {
        empty.style.display = "none";   // 있으면 숨기기
    }
}




document.querySelector("#clear-done").addEventListener("click", () => {
    list.querySelectorAll(".done").forEach(li => li.remove());
    updateCount();
});
document.querySelector("#clear-all").addEventListener("click", () => {
    list.innerHTML = "";  // 목록 통째로 비우기
    updateCount();
});

</script>

</body>
</html>
