<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <meta charset="UTF-8">

  <!-- Swiper (swiper.html과 동일한 CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>호텔</title>

  <!-- 공통 CSS (header / footer / to-top / 기본초기화) -->
  <link rel="stylesheet" href="common.css">

  <style>
    /* ========== 본문 영역 ========== */
    .content {
      max-width: 100%;      /* 본문 너비를 화면 전체(100%)로 */
      margin: 0 auto;
      padding: 60px 20px;
      min-height: 500px;
    }



    /* ========== 반응형 (1000px 이하) — 페이지 고유 규칙만 ==========
       header 반응형은 common.css로 이동. */
    @media (max-width: 1000px) {
      .section {
        padding: 40px 16px;
      }

      .section-title {
        font-size: 22px;            /* 모바일 섹션 제목 축소 */
        letter-spacing: 2px;
        margin-bottom: 24px;
      }

      /* 히어로 배너: 모바일 비율 (폭 대비 세로가 긴 형태) */
      .hero {
        aspect-ratio: 360 / 640;
      }

      /* 텍스트 오버레이: 모바일 폰트 축소, 중앙 유지 */
      .hero-title {
        font-size: 1.5rem;
        letter-spacing: 2px;
        margin-bottom: 12px;
      }
      .hero-btn {
        padding: 9px 24px;
        font-size: 12px;
        letter-spacing: 1px;
      }

      /* 슬라이드 인디케이터(점) — 이미지 하단에 고정, 여백 확보 */
      .hero .swiper-pagination {
        bottom: 14px;
      }

      /* 하단 어워드 배너: 모바일 비율 */
      .hero.hero-bottom {
        aspect-ratio: 360 / 480;
      }
      /* 어워드 배경 어둡게 + 오버레이(제목/인용구 이미지) 중앙 정렬 보정 */
      .hero.hero-bottom::before {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);   /* 어두운 배경 강조 */
        z-index: 1;
      }
      .hero.hero-bottom .hero-overlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;               /* 리본/메달/제목 이미지 비율 유지 */
        z-index: 2;
      }

      /* ===== ROOMS / EVENT: 모바일에서 가로 스크롤 카드 ===== */
      .row.rooms-row,
      .row.event-row {
        flex-wrap: nowrap;          /* 한 줄 가로 유지 (wrap 덮어쓰기) */
        overflow-x: auto;           /* 가로 스크롤 */
        overflow-y: hidden;
        gap: 16px;
        padding-bottom: 8px;
        cursor: grab;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;      /* 스크롤바 숨김 (firefox) */
      }
      .row.rooms-row::-webkit-scrollbar,
      .row.event-row::-webkit-scrollbar {
        display: none;              /* 스크롤바 숨김 (webkit) */
      }

      /* 모바일 카드 폭: 화면의 약 70% (한 장만 온전히 + 다음 장 일부 노출)
         !important: 데스크톱 고정폭(400px) 규칙과 특이도가 같아 순서로 덮어써지는 것 방지 */
      .row.rooms-row .item,
      .row.event-row .item {
        flex: 0 0 70vw !important;
        width: 70vw !important;
        height: auto !important;
      }
      .caption {
        font-size: 13px;
        margin-top: 10px;
      }
    }



    /* ========== 배너(hero / bottom 공통 구조) ========== */
    /* 기본값: 위쪽 슬라이더 배너 비율 (Figma 2000x800) */
    .hero {
      width: 100%;
      aspect-ratio: 2000 / 800;
      position: relative;
    }

    /* 아래쪽 2024 BEST HOTEL 배너 전용 비율 (Figma 2000x480) */
    .hero.hero-bottom {
      aspect-ratio: 2000 / 480;
    }

    .hero .swiper-slide {
      position: relative;   /* 자식(hero-text)의 기준점이 됨 */
        height: 100%;
    }

    .hero-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 80%;
      display: block;
    }

    .hero-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      text-align: center;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;             /* 요소 사이 간격 10px */
    }

    .hero-title {
  font-size: 2rem;
  font-weight: 700;
  font-family: 'KoROAD', sans-serif;
  letter-spacing: 3px;
  margin-bottom: 16px;
}


    /* SEE MORE 버튼 (투명 배경 + 흰 테두리, hover 시 반전) */
    .hero-btn {
      display: inline-block;
      padding: 12px 32px;
      border: 1px solid #fff;
      background: transparent;
      color: #fff;
      font-size: 14px;
      letter-spacing: 2px;
      text-decoration: none;
      transition: background 0.3s, color 0.3s;
    }

    .hero-btn:hover {
      background: #fff;
      color: #000;
    }

    .hero-icon {
      width: 80px;
      height: 80px;
    }
    .hero-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }


    /* ========== 섹션 공통 (ROOMS / EVENT) ========== */
    .section {
      max-width: 2080px;     /* 가로 스크롤을 위해 축소 (사진 일부가 화면 밖으로) */
      margin: 0 auto;        /* 화면 가운데 정렬 */
      padding: 40px 20px;
      text-align: left;     /* 이미지/콘텐츠 좌측 정렬 */
    }

    .section-title {
      font-size: 32px;
      letter-spacing: 4px;
      margin-bottom: 40px;
      text-align: center;
    }


    /* ROOMS / EVENT 공통: gap 20px로 간격 통일 (Figma) */
    .row {
      display: flex;
      justify-content: flex-start;   /* 이미지 좌측부터 나열 */
      gap: 20px;
    }

    /* ROOMS / EVENT 공통: 가로 스크롤 방식 — 일부만 보이고 옆으로 넘김.
       이미지 크기/간격/정렬은 그대로 두고 배치(한 줄 + overflow-x)만 통일. */
    .row.rooms-row,
    .row.event-row {
      flex-wrap: nowrap;
      overflow-x: auto;             /* 가로 스크롤 */
      overflow-y: hidden;           /* 세로는 안 움직이게 */
      scrollbar-width: none;        /* 스크롤바 숨김 (firefox) */
      -ms-overflow-style: none;     /* IE / 구형 Edge */
      cursor: grab;                 /* 드래그 가능함 표시 */
    }
    .row.rooms-row::-webkit-scrollbar,
    .row.event-row::-webkit-scrollbar {
      display: none;                /* 스크롤바 숨김 (webkit) */
    }
    .row.rooms-row .item {
      flex: 0 0 auto;
      width: 400px;          /* 이미지 한 장 너비 (Figma) — 고정폭이라 스크롤에 적합 */
    }
    .row.rooms-row .item img {
      width: 400px;
      height: 300px;         /* 이미지 높이 (Figma) */
      aspect-ratio: auto;
      object-fit: cover;     /* 비율 유지하며 잘림 */
      display: block;
    }

    .item {
      min-width: 0;
    }

    /* EVENT: 이미지 400×341, 캡션 포함 블록 높이 357px (gap 20px 통일) */
    .row.event-row .item {
      flex: 0 0 auto;
      width: 400px;
      height: 357px;            /* 이미지 341 + 캡션 영역 포함 (Figma) */
    }
    .row.event-row .item img {
      width: 400px;
      height: 341px;
      aspect-ratio: auto;
      object-fit: cover;        /* 비율 유지하며 잘림 */
      display: block;
    }

    /* ===== 모바일 카드 이미지 크기 (1000px 이하) =====
       주의: 위 데스크톱 규칙과 특이도가 같으므로(0,3,1),
       이 모바일 규칙이 반드시 "뒤에" 와야 소스 순서로 이겨서 적용됨.
       (미디어쿼리 자체는 특이도에 기여하지 않음) */
    @media (max-width: 1000px) {
      .row.rooms-row .item img,
      .row.event-row .item img {
        width: 100% !important;
        height: auto !important;
        aspect-ratio: 4 / 3 !important;
        object-fit: cover;
        display: block;
      }
    }

    .caption {
      font-size: 14px;
      color: #555;
      margin-top: 16px;         /* 357 - 341 = 16px (캡션 영역) */
    }
    .row {
  display: flex;
  justify-content: flex-start;
  gap: 20px;
  flex-wrap: wrap;   /* ← 이 줄 추가: 화면 넘으면 자동으로 다음 줄로 */
}


    /* ========== Swiper 페이지네이션 점 색 (배경 이미지 위라 흰색 계열로) ========== */
    /* 기본 점: 반투명 흰색 */
    .hero .swiper-pagination-bullet {
      background: #fff;
      opacity: 0.5;
    }
    /* 선택된 점: 불투명 흰색 (선명하게) */
    .hero .swiper-pagination-bullet-active {
      background: #fff;
      opacity: 1;
    }


    /* ========== 이미지 확대 모달 (ROOMS / EVENT 클릭) ==========
       평소 display:none, .show 부여 시 flex(중앙 정렬)로 노출. */
    .image-modal {
      display: none;                 /* 기본 숨김 */
      position: fixed;
      inset: 0;                      /* 전체 화면 덮기 (top/right/bottom/left:0) */
      background: rgba(0, 0, 0, 0.8);/* 반투명 검정 배경(오버레이) */
      z-index: 1000;                 /* 헤더(100)/투탑보다 위 */
      align-items: center;           /* 세로 가운데 */
      justify-content: center;       /* 가로 가운데 */
      padding: 20px;
    }
    .image-modal.show {
      display: flex;                 /* 클릭 시 노출 */
    }
    .image-modal__img {
      max-width: 80%;                /* 화면 폭의 80%까지만 */
      max-height: 80%;               /* 화면 높이의 80%까지만 */
      object-fit: contain;           /* 비율 유지하며 맞춤 */
      display: block;
    }
    /* 닫기 버튼(X): 모달 우측 상단 */
    .image-modal__close {
      position: absolute;
      top: 20px;
      right: 28px;
      background: none;
      border: none;
      color: #fff;
      font-size: 40px;
      line-height: 1;
      cursor: pointer;
      z-index: 1001;
    }
    .image-modal__close:hover {
      opacity: 0.7;
    }

    /* ROOMS / EVENT 사진: 클릭 가능함을 시각 표시 */
    .rooms-row .item img,
    .event-row .item img {
      cursor: pointer;
    }
  </style>
</head>

<body>

  <!-- ===== 헤더 (Web Component) ===== -->
  <my-header></my-header>


  <!-- ===== 1. hero 배너 (swiper 슬라이드, 사진 위에 글자) ===== -->
  <div class="swiper hero mySwiper">
    <div class="swiper-wrapper">
      <div class="swiper-slide">
        <img class="hero-img" src="hero1.jpg" alt="메인 배너1">
        <div class="hero-text">
          <h2 class="hero-title">SWEET MOMENT</h2>
          <a href="#" class="hero-btn">SEE MORE</a>
        </div>
      </div>
      <div class="swiper-slide">
        <img class="hero-img" src="hero2.jpg" alt="메인 배너2">
        <div class="hero-text">
          <h2 class="hero-title">URBAN RESORT</h2>
          <a href="#" class="hero-btn">SEE MORE</a>
        </div>
      </div>
      <div class="swiper-slide">
        <img class="hero-img" src="hero3.jpg" alt="메인 배너3">
        <div class="hero-text">
          <h2 class="hero-title">RELAX & RELIEF</h2>
          <a href="#" class="hero-btn">SEE MORE</a>
        </div>
      </div>
    </div>
    <div class="swiper-pagination"></div>  <!-- 하단 점 -->
  </div>


  <!-- ===== 2. ROOMS 섹션 (객실 5장 가로 배치) ===== -->
  <section class="section">
    <h2 class="section-title">ROOMS</h2>
    <div class="row rooms-row drag-scroll">
      <div class="item"><img src="rooms/rooms1.jpg" alt="객실1"></div>
      <div class="item"><img src="rooms/rooms2.jpg" alt="객실2"></div>
      <div class="item"><img src="rooms/rooms3.jpg" alt="객실3"></div>
      <div class="item"><img src="rooms/rooms4.jpg" alt="객실4"></div>
      <div class="item"><img src="rooms/rooms5.jpg" alt="객실5"></div>
    </div>
  </section>


  <!-- ===== 3. EVENT 섹션 (db.json에서 fetch로 동적 렌더링) ===== -->
  <section class="section">
    <h2 class="section-title">EVENT</h2>
    <div class="row event-row drag-scroll" id="eventList">
      <!-- JS가 db.json의 events 데이터로 채움 -->
    </div>
  </section>


  <!-- ===== 4. bottom 배너 (2024 BEST HOTEL) ===== -->
  <div class="hero hero-bottom">
  <img class="hero-img" src="image/bottom.jpg" alt="하단 배너">
<img class="hero-overlay" src="image/bottom-title.png" alt="2024 베스트 호텔">
</div>



  <!-- ===== 푸터 (Web Component) ===== -->
  <my-footer></my-footer>


  <!-- ===== 맨 위로 버튼 (Web Component) ===== -->
  <my-to-top></my-to-top>


  <!-- ===== 이미지 확대 모달 (ROOMS / EVENT 클릭 시) =====
       평소엔 display:none, JS가 .show 부여 시 flex로 중앙 표시. -->
  <div class="image-modal" id="imageModal" aria-hidden="true">
    <button class="image-modal__close" type="button" aria-label="닫기">&times;</button>
    <img class="image-modal__img" src="" alt="확대 이미지">
  </div>


  <!-- Web Components: 헤더(모바일 메뉴/서브메뉴) + 푸터 + 맨 위로 -->
  <script src="MyHeader.js"></script>
  <script src="MyFooter.js"></script>
  <script src="MyToTop.js"></script>

  <script>
    // ========== 마우스 드래그로 가로 스크롤 (HOME 전용, common.js에서 이관) ==========
    // 인자로 받은 CSS 선택자 요소에 드래그 스크롤을 적용.
    // - 요소가 없으면(null) 조용히 종료
    // - 드래그 중일 때 cursor가 grabbing으로 변하도록 CSS의 .dragging 클래스와 짝을 맞춤
    // - 이미지 고스트 드래그 방지(dragstart preventDefault) 포함
    function initDragScroll(selector) {
      const row = document.querySelector(selector);
      if (!row) return;

      let isDown = false;     // 마우스가 눌려 있는지
      let startX = 0;         // 드래그 시작 시점의 마우스 X좌표
      let scrollLeft = 0;     // 드래그 시작 시점의 가로 스크롤 위치

      // 드래그 시작
      row.addEventListener("mousedown", (e) => {
        isDown = true;
        row.classList.add("dragging");
        startX = e.pageX - row.offsetLeft;
        scrollLeft = row.scrollLeft;
      });

      // 이미지 드래그(고스트 이미지) 방지 — 요소 안의 이미지를 마우스로
      // 끌 때 브라우저 기본 동작이 뜨는 것을 차단
      row.addEventListener("dragstart", (e) => e.preventDefault());

      // 마우스가 영역을 벗어나거나 버튼을 놓으면 드래그 종료
      const endDrag = () => {
        if (!isDown) return;
        isDown = false;
        row.classList.remove("dragging");
      };
      row.addEventListener("mouseleave", endDrag);
      row.addEventListener("mouseup", endDrag);

      // 드래그 이동 — 누른 상태에서만 스크롤 이동량을 반영
      row.addEventListener("mousemove", (e) => {
        if (!isDown) return;
        e.preventDefault();
        const x = e.pageX - row.offsetLeft;
        const walk = x - startX; // 이동 거리(음수면 왼쪽으로 스크롤)
        row.scrollLeft = scrollLeft - walk;
      });
    }

    // ROOMS 섹션 / EVENT 섹션(#eventList 자체는 정적으로 존재 → 자식이 비동기 fetch로
    // 채워진 뒤에도 컨테이너에 바인딩된 리스너가 정상 동작함)
    initDragScroll(".rooms-row");
    initDragScroll("#eventList");

    // ========== 이미지 확대 모달 (ROOMS / EVENT) ==========
    // 이벤트 위임(event delegation): document에서 클릭을 잡아 대상이
    // ROOMS/EVENT 이미지인지 판별. EVENT는 fetch로 동적 렌더링되므로
    // 위임 방식이 아니면 나중에 추가된 img에 리스너가 안 붙음.
    (function initImageModal() {
      const modal = document.getElementById("imageModal");
      const modalImg = modal.querySelector(".image-modal__img");
      const closeBtn = modal.querySelector(".image-modal__close");

      // ROOMS/EVENT 이미지 클릭 → 모달 열기
      document.addEventListener("click", function (e) {
        const img = e.target.closest(".rooms-row .item img, .event-row .item img");
        if (!img) return;
        modalImg.src = img.src;            // 클릭한 이미지 src 복사
        modalImg.alt = img.alt || "확대 이미지";
        modal.classList.add("show");       // display:flex 로 노출
        modal.setAttribute("aria-hidden", "false");
      });

      // 닫기 헬퍼
      function closeModal() {
        modal.classList.remove("show");
        modal.setAttribute("aria-hidden", "true");
      }

      // 1) 닫기 버튼 클릭
      closeBtn.addEventListener("click", closeModal);
      // 2) 어두운 배경(overlay) 클릭 — 이미지 자체 클릭은 제외
      modal.addEventListener("click", function (e) {
        if (e.target === modal) closeModal();
      });
      // 3) ESC 키로도 닫기
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && modal.classList.contains("show")) closeModal();
      });
    })();

    // ========== 3. hero 배너 Swiper ==========
    var heroSwiper = new Swiper(".hero.mySwiper", {
      loop: true,
      pagination: {
        el: ".hero .swiper-pagination",
        clickable: true,
      },
      autoplay: {
        delay: 2000,
        disableOnInteraction: false,
      },
    });

    // ========== 4. EVENT 섹션: db.json에서 fetch로 동적 렌더링 ==========
    (async function loadEvents() {
      const list = document.getElementById("eventList");
      try {
        const res = await fetch("../db.json");   // html/ → 상위 day7/db.json
        if (!res.ok) throw new Error("db.json 불러오기 실패");
        const data = await res.json();
        const events = data.events || [];

        list.innerHTML = events.map(ev => `
          <div class="item">
            <img src="${ev.img}" alt="${ev.alt || ev.title}">
            <p class="caption">${ev.title}</p>
          </div>
        `).join("");
      } catch (err) {
        console.error("EVENT 로드 실패:", err);
        list.innerHTML = `<p class="caption">이벤트를 불러오지 못했습니다.</p>`;
      }
    })();
  </script>

</body>
</html>
