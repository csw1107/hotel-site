<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>호텔 - PREMIUM 예약</title>

  <!-- 공통 CSS (header / footer / to-top / 기본초기화) -->
  <link rel="stylesheet" href="common.css">

  <!-- Swiper (객실 대표 사진 슬라이드용 — HOME.html과 동일 CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

  <style>
    /* 페이지 고유 버튼 기본 (공통 CSS엔 없음) */
    button { font-family: inherit; cursor: pointer; }


    /* ========== 배너 ========== */
    .hero {
      width: 100%;
      aspect-ratio: 2000 / 400;
      position: relative;
    }

    .hero-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .hero::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.2);
      z-index: 1;
    }

    .hero-text {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      text-align: center;
      z-index: 5;
    }

    .hero-title { font-size: 2rem; letter-spacing: 3px; margin-bottom: 10px; }
    .hero-desc { font-size: 0.95rem; letter-spacing: 1px; }


    /* ========== 섹션 ========== */
    .section {
      max-width: 1440px;
      margin: 0 auto;
      padding: 80px 20px;
    }

    .section-title {
      font-size: 28px;
      letter-spacing: 3px;
      text-align: center;
      margin-bottom: 50px;
      font-weight: normal;
    }
    .detail-row {
      display: flex;
      gap: 50px;
    }

    /* ========== 좌우 2단 배치 ==========
       ⚠ min-width:0 + overflow:hidden 이 핵심 수정.
       flex 아이템은 기본 min-width:auto 로 "내용(이미지)의 최소 폭" 이하으로
       줄어들지 못함. Swiper 초기화 타이밍에 따라 slide 폭이 비정상적으로
       커지면 그 값이 그대로 flex 최소 폭이 되어 .detail-left 가 33,554,432px(2^25)
       로 팽창하고 .detail-right 을 찌그러뜨림 → 빈 베이지 박스 증상.
       min-width:0 으로 이 최소 폭 제한을 풀어 부모(.detail-row) 폭에 맞춰
       정상 축소되게 함. (이게 없으면 max-width 만으로는 막을 수 없음) */
    .detail-left {
      flex: 1;
      min-width: 0;          /* flex 자식이 부모 폭을 침범하지 못하게 (근본 원인 해결) */
      overflow: hidden;      /* 안생장치: 그래도 넘치면 잘라냄 */
    }
    .detail-right {
      flex: 1;
      min-width: 0;
    }


    /* ---------- 왼쪽: 사진 (Swiper 슬라이드) ---------- */
    /* 객실 대표 사진 슬라이더 — 기존 썸네일 클릭 방식 대신 좌우 스와이프 */
    .room-swiper {
      width: 100%;
      max-width: 100%;
      margin-bottom: 12px;
      overflow: hidden;
      box-sizing: border-box;
    }
    .room-swiper .swiper-slide {
      width: 100%;
      box-sizing: border-box;
      aspect-ratio: 1 / 1;     /* 정사각형 비율 유지 */
    }
    .room-swiper .swiper-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .room-desc {
      font-size: 13px;
      line-height: 1.8;
      color: #555;
    }


    /* ---------- 오른쪽: 달력 ---------- */
    .cal-header {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 30px;
      margin-bottom: 20px;
    }

    .cal-btn {
      background: none;
      border: none;
      font-size: 18px;
      color: #666;
      cursor: pointer;
    }

    /* 이전 달로 갈 수 없을 때 비활성화 */
    .cal-btn:disabled {
      color: #ccc;
      cursor: default;
    }

    .cal-title { font-size: 15px; }

    /* 달력 = 7칸 그리드 */
    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      border-bottom: 1px solid #ddd;
      padding-bottom: 20px;
      margin-bottom: 24px;
    }

    .cal-day-name {
      font-size: 13px;
      padding: 10px 0;
      color: #333;
    }

    .cal-day-name.sun { color: #e74c3c; }

    /* 날짜 칸: 모든 칸 동일 고정 높이 + flexbox 중앙 정렬 */
    .cal-date {
      font-size: 13px;
      height: 56px;             /* 라벨 한 줄까지 포함한 고정 높이 (선택 여부 무관) */
      cursor: pointer;
      position: relative;
      display: flex;
      flex-direction: column;   /* 숫자 위, 라벨 아래 */
      align-items: center;
      justify-content: center;
      overflow: hidden;         /* 라벨이 들어와도 칸 높이가 늘어나지 않게 */
      gap: 2px;
    }

    .cal-date.other-month { color: #ccc; cursor: default; }
    .cal-date.sun { color: #e74c3c; }

    /* 예약완료 - 클릭 불가 (빨간 라벨 + 회색조 흐림 + 클릭 차단 커서) */
    .cal-date.booked {
      color: #999;              /* 날짜 숫자는 회색조로 흐리게 */
      cursor: not-allowed;      /* 클릭 불가능 시각 표시 */
      opacity: 0.6;             /* 전체 칸을 흐리게 → 선택 불가 느낌 */
    }

    /* 지난 날짜 - 클릭 불가 (회색)
       !important: 일요일 빨간색(.sun) 등 다른 색 규칙이 덮어쓰지 못하게 강제 */
    .cal-date.past {
      color: #ccc !important;
      cursor: default;
    }

    /* 라벨(::after) 공간을 미리 확보: 라벨이 없는 칸도 같은 높이 유지 */
    .cal-date::after {
      content: "";              /* 기본 빈 공간 (자리만 차지) */
      display: block;
      font-size: 9px;
      line-height: 1;
      min-height: 11px;         /* 라벨 한 줄 높이 확보 → 모든 칸 동일 높이 */
    }

    /* "예약완료" 라벨 - 선명한 빨간색 (opacity 영향 받지 않게 따로 색 지정) */
    .cal-date.booked::after {
      content: "예약완료";
      color: #ff0000;           /* 빨간색으로 작게 표시 */
    }

    /* ---------- 범위 선택 (초록) ---------- */
    .cal-date.in-range {
      background: #22c55e;
      color: #fff;
    }

    .cal-date.range-start::after {
      content: "입실";
    }

    .cal-date.range-end::after {
      content: "퇴실";
    }

    .cal-date:not(.other-month):not(.booked):not(.in-range):hover {
      background: #f0f0f0;
      border-radius: 4px;
    }


    /* ---------- 추가 인원 ---------- */
    .option-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding-bottom: 24px;
      border-bottom: 1px solid #ddd;
      margin-bottom: 24px;
    }

    .option-label { font-size: 14px; }

    .option-row select {
      padding: 8px 12px;
      border: 1px solid #ddd;
      font-size: 13px;
    }

    .option-note {
      font-size: 12px;
      color: #999;
    }


    /* ---------- 총 합계 ---------- */
    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .total-label { font-size: 14px; }

    .total-price {
      font-size: 20px;
      font-weight: bold;
    }


    /* ---------- 버튼 2개 ---------- */
    .btn-row {
      display: flex;
      gap: 12px;
    }

    .btn {
      flex: 1;
      padding: 16px;
      font-size: 14px;
      border: 1px solid #ddd;
    }

    .btn-cancel { background: #fff; color: #333; }

    .btn-submit {
      background: #2b2b2b;
      color: #fff;
      border-color: #2b2b2b;
    }

    .btn-submit:hover { background: #444; }


    /* ---------- 모달 (경고 팝업) ---------- */
    .modal-backdrop {
      display: none;              /* 평소엔 숨김 */
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .modal {
      background: #fff;
      padding: 40px 60px;
      text-align: center;
    }

    .modal p {
      font-size: 14px;
      margin-bottom: 24px;
    }

    .modal button {
      background: #2b2b2b;
      color: #fff;
      border: none;
      padding: 10px 24px;
      font-size: 13px;
    }


    /* ========== 반응형 (1000px 이하) — 페이지 고유 규칙만 ==========
       header 반응형은 common.css로 이동. */
    @media (max-width: 1000px) {
      .detail-row { flex-direction: column; }

      /* 모바일: 양쪽 칸 모두 가로폭 100% 꽉 채우기 (이미지 작게/오른쪽 빈 공간 해결) */
      .detail-left { width: 100%; flex: none; }
      .detail-right { width: 100%; flex: none; }
    }

    /* ========== 태블릿/모바일 (768px 이하) ==========
       달력은 좁은 화면에서도 유지하되 칸/글자 축소. */
    @media (max-width: 768px) {
      .room-thumbs {
        display: none;
      }

      .cal-date {
        height: 44px;
        font-size: 12px;
      }

      .cal-date::after {
        font-size: 8px;
      }

      .cal-day-name {
        font-size: 11px;
        padding: 6px 0;
      }

      .calendar {
        padding-bottom: 12px;
        margin-bottom: 16px;
      }
    }


    /* ===== 객실 썸네일 갤러리 (.room-thumbs) =====
       ★ 기본 규칙은 미디어쿼리 "바깥"에 둬야 PC에서도 4-column이 적용됨.
         여기선 폭(25%)을 명시하지 않는다 — Swiper가 slidesPerView로 폭을
         직접 제어하므로 CSS width가 있으면 모바일 breakpoints와 충돌함.
         비율/투명도/클릭 가능 여부만 여기서 담당. */
    .room-thumbs {
      width: 100%;
      margin-top: 12px;
    }
    .room-thumbs .swiper-slide {
      aspect-ratio: 1 / 1;          /* 정사각형 썸네일 */
      cursor: pointer;
      opacity: 0.5;                 /* 선택 안 된 것은 흐리게 */
    }
    .room-thumbs .swiper-slide-thumb-active {
      opacity: 1;                   /* 선택된 썸네일만 진하게 */
    }
    .room-thumbs .swiper-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
  </style>
</head>

<body>

  <!-- ===== 헤더 (Web Component) ===== -->
  <my-header></my-header>


  <!-- ===== 배너 ===== -->
  <div class="hero">
    <img class="hero-img" src="image/reservation2.jpg" alt="실시간예약 배너">
    <div class="hero-text">
      <h2 class="hero-title">RESERVATION</h2>
      <p class="hero-desc">실시간예약</p>
    </div>
  </div>


  <!-- ===== 객실 상세 + 예약 ===== -->
  <section class="section">
    <h2 class="section-title" id="roomTitle"></h2>

    <div class="detail-row">

      <!-- 왼쪽: 사진 — 슬라이드는 JS가 db.json 에서 채움 -->
      <div class="detail-left">
        <div class="swiper room-swiper">
          <div class="swiper-wrapper"></div>
          <div class="swiper-button-next"></div>
          <div class="swiper-button-prev"></div>
        </div>

        <div class="swiper room-thumbs">
          <div class="swiper-wrapper"></div>
        </div>

        <p class="room-desc" id="roomDesc"></p>
      </div>

      <!-- 오른쪽: 달력 + 예약 -->
      <div class="detail-right">

        <div class="cal-header">
          <button class="cal-btn" id="prevBtn">&lt;</button>
          <span class="cal-title" id="calTitle">2025년 05월</span>
          <button class="cal-btn" id="nextBtn">&gt;</button>
        </div>

        <!-- 달력 본체 (JS가 채움) -->
        <div class="calendar" id="calendar"></div>

        <!-- 추가 인원 -->
        <div class="option-row">
          <span class="option-label">추가 인원</span>
          <select id="extraPerson">
            <option value="0">없음</option>
            <option value="1">1명</option>
            <option value="2">2명</option>
          </select>
          <span class="option-note">기준 인원 2명, 추가 시 한 명당 객실 가격의 20%</span>
        </div>

        <!-- 총 합계 -->
        <div class="total-row">
          <span class="total-label">총 합계</span>
          <span><span class="total-price" id="totalPrice">150,000</span> 원</span>
        </div>

        <!-- 버튼 -->
        <div class="btn-row">
          <button class="btn btn-cancel" id="cancelBtn">취소</button>
          <button class="btn btn-submit">예약하기</button>
        </div>

      </div>
    </div>
  </section>


  <!-- ===== 푸터 (Web Component) ===== -->
  <my-footer></my-footer>


  <!-- ===== 맨 위로 버튼 (Web Component) ===== -->
  <my-to-top></my-to-top>


  <!-- ===== 경고 모달 ===== -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <p id="modalMsg"></p>
      <button id="modalConfirm">확인</button>
    </div>
  </div>


  <!-- Web Components: 헤더(모바일 메뉴/서브메뉴) + 푸터 + 맨 위로 -->
  <script src="MyHeader.js"></script>
  <script src="MyFooter.js"></script>
  <script src="MyToTop.js"></script>

  <!-- 예약 API 모듈 (json-server + db.json 연동) -->
  <script src="reservation-api.js"></script>

  <!-- Swiper JS (객실 대표 사진 슬라이드) -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

  <script>
    // ========== 3. 객실 대표 사진 슬라이더 (Swiper) ==========
    // DOM/이미지 로드 후 초기화하여 슬라이드 폭 계산이 깨지지 않게 함.
    let __roomSwiperInitDone = false;     // 중복 초기화 방지 가드 (load 가 두 번 발생하거나
                                          // readyState complete 분기와 경쟁 시 두 번 초기화되는 것 차단)
    function initRoomSwiper() {
      if (__roomSwiperInitDone) return;          // 이미 초기화됨 → 두 번째 호출 중단 (중복 초기화 방지)
      if (typeof Swiper === "undefined") return; // CDN 미로드 시 안전 종료
      const el = document.querySelector(".room-swiper");
      if (!el) return;                            // 컨테이너 없으면 중단
      // 부모(.detail-left) 폭이 아직 0이면 레이아웃이 덜 잡힌 것 → 다음 프레임으로 연기
      if (el.clientWidth === 0) {
        requestAnimationFrame(initRoomSwiper);
        return;
      }
      __roomSwiperInitDone = true;

      // ★ 썸네일 Swiper: 반응형.
      //   PC(>480px) → 4개 한 줄 / 모바일(≤480px) → 2.2개(다음 썸네일 일부 노출)
      //   → 좁은 화면에서도 좌우 스와이프로 넘길 수 있음 (Swiper 기본 터치 스와이프).
      //   slidesPerView로 폭을 제어하므로 CSS width는 두지 않음(충돌 방지).
      //   slideToClickedSlide: 썸네일 클릭 시 그 slide로 썸네일도 이동(선택 동기화)
      //   watchSlidesVisibility: 각 썸네일 가시성 추적 → 클릭 매핑 정확도 향상
      const thumbsSwiper = new Swiper(".room-thumbs", {
        slidesPerView: 2.2,
        spaceBetween: 8,
        watchSlidesProgress: true,
        watchSlidesVisibility: true,
        slideToClickedSlide: true,
        breakpoints: {
          481: { slidesPerView: 4 },   // 481px 이상(태블릿/PC): 4개 한 줄에 모두
        },
      });

      // ★ 큰 사진 Swiper: loop 사용 안 함.
      //   이유: loop:true 인 큰 Swiper와 loop:false 인 썸네일을 thumbs로 연결하면
      //   Swiper가 loop 복제 slide 인덱스와 썸네일 인덱스를 잘못 매핑해
      //   "썸네일 클릭 → 큰 사진 미전환" 버그가 발생함. loop를 끄면 안정 연동됨.
      new Swiper(".room-swiper", {
        observer: true,
        resizeObserver: true,
        updateOnImagesReady: true,
        navigation: {
          nextEl: ".room-swiper .swiper-button-next",
          prevEl: ".room-swiper .swiper-button-prev",
        },
        thumbs: {
          swiper: thumbsSwiper,
        },
        on: {
          imagesReady: function () { this.update(); },
        },
      });
    }

    // 이미지까지 모두 로드된 뒤 초기화 (폭 계산 안정화)
    // ★ 주의: 슬라이드는 loadRoom() 이 db.json 에서 동적으로 채운다.
    //   따라서 initRoomSwiper 는 loadRoom 완료 후에 실행되어야 한다.
    //   아래 호출부는 제거하고, 페이지 초기화 IIFE 에서 loadRoom() 이후에 호출한다.
    function startRoomSwiper() {
      if (document.readyState === "complete") {
        initRoomSwiper();
      } else {
        window.addEventListener("load", initRoomSwiper);
      }
    }


    // ========== 4. 달력 (범위 선택) ==========
    // ROOM_PRICE / PRICE_TABLE 은 db.json 에서 getRoom(ROOM_ID) 으로 채워진다.
    let ROOM_PRICE = 0;          // ← 객실별로 이 숫자만 바꾸면 됨
    const MAX_NIGHTS = 6;         // 최대 6박

    // ========== 요금표 (db.json 의 price[] → getRoom 이 조립) ==========
    // 성수기(07.01~09.30) / 비수기(그 외) × 요일(주중/주말/휴일)
    let PRICE_TABLE = {
      off: { weekday: 0, weekend: 0, holiday: 0 },
      peak: { weekday: 0, weekend: 0, holiday: 0 }
    };

    // 해당 날짜가 성수기(7~9월)인지 판별 → 요금표 세트 선택
    function isPeakSeason(date) {
      const month = date.getMonth() + 1;   // 1~12
      return month >= 7 && month <= 9;
    }

    // 날짜 → 요금 반환 (성수기/비수기 + 요일 구분)
    function priceByDay(date) {
      const season = isPeakSeason(date) ? PRICE_TABLE.peak : PRICE_TABLE.off;
      const dow = date.getDay();
      if (dow === 6) return season.weekend;   // 토 → 주말
      if (dow === 0) return season.holiday;   // 일 → 휴일
      return season.weekday;                  // 월~금 → 주중
    }
    // ========== 예약완료 날짜 (db.json 연동) ==========
    // 프리미엄 = room_id 3. json-server에서 불러와 BOOKED에 채운다.
    const ROOM_ID = 3;
    let BOOKED = [];                 // db에서 불러온 "예약완료" 날짜 배열

    // ========== 객실 정보 (db.json 연동) ==========
    // getRoom(ROOM_ID) 으로 방 이름/사진/설명/요금을 불러와 화면에 반영.
    // swiper 슬라이드(메인 + 썸네일)는 images 배열로 동적 생성.
    // 반환: true(슬라이드 정상 채움) / false(데이터 없음 → Swiper 초기화 건너뜀)
    async function loadRoom() {
      try {
        const room = await getRoom(ROOM_ID);
        console.log("[loadRoom] room_id", ROOM_ID, "→", room.name_eng, "이미지", room.images);

        // ★ 데이터 방어: images 가 없으면 슬라이드를 만들지 않고 false 반환
        if (!room.images || !room.images.length) {
          console.error("[loadRoom] 이미지 데이터가 비어 있어 슬라이드를 만들지 않습니다.");
          return false;
        }

        const title = (room.name_eng || "").toUpperCase();
        document.getElementById("roomTitle").textContent = title;

        // 메인 swiper + 썸네일 swiper 채우기
        const mainWrap = document.querySelector(".room-swiper .swiper-wrapper");
        const thumbWrap = document.querySelector(".room-thumbs .swiper-wrapper");
        const slidesHtml = room.images
          .map((img, i) => `<div class="swiper-slide"><img src="${img}" alt="${room.name} ${i + 1}"></div>`)
          .join("");
        const thumbHtml = room.images
          .map((img, i) => `<div class="swiper-slide"><img src="${img}" alt="썸네일 ${i + 1}"></div>`)
          .join("");
        if (mainWrap) mainWrap.innerHTML = slidesHtml;
        if (thumbWrap) thumbWrap.innerHTML = thumbHtml;

        // 설명 (한글 + 영문)
        const descEl = document.getElementById("roomDesc");
        if (descEl) descEl.innerHTML = `${room.desc}<br>${room.desc_eng}`;

        // 요금 — db.json 의 price[] 조립 결과 반영
        ROOM_PRICE = room.roomPrice;
        PRICE_TABLE = room.priceTable;
        return true;
      } catch (e) {
        console.error("[loadRoom] 객실 정보 조회 실패:", e);
        return false;
      }
    }

    // 캘린더 렌더 전 예약 날짜 미리 불러두기
    async function loadBooked() {
      try {
        BOOKED = await fetchBookedDates(ROOM_ID);
      } catch (e) {
        console.error("예약 목록 조회 실패:", e);
        BOOKED = [];
      }
    }

    // 오늘 기준
    const TODAY = new Date();
    TODAY.setHours(0, 0, 0, 0);  // 시간 제거 (날짜만 비교)

    // "YYYY-MM-DD" 문자열 → Date 객체 (시간 0시로 맞춰 날짜 비교에 사용)
    function parseDate(str) {
      const [y, m, d] = str.split("-").map(Number);
      return new Date(y, m - 1, d);   // 로컬 자정 기준 Date 객체
    }

    let viewYear = TODAY.getFullYear();
    let viewMonth = TODAY.getMonth() + 1;   // 오늘이 속한 달로 열기
    let startDate = null;    // 입실일
    let endDate = null;      // 퇴실일

    const calendarEl = document.getElementById("calendar");
    const calTitleEl = document.getElementById("calTitle");
    const dayNames = ["일", "월", "화", "수", "목", "금", "토"];

    function renderCalendar() {
      calendarEl.innerHTML = "";
      calTitleEl.textContent = `${viewYear}년 ${String(viewMonth).padStart(2, "0")}월`;

      // 요일 이름 줄
      dayNames.forEach((name, i) => {
        const el = document.createElement("div");
        el.className = "cal-day-name" + (i === 0 ? " sun" : "");
        el.textContent = name;
        calendarEl.appendChild(el);
      });

      const firstDay = new Date(viewYear, viewMonth - 1, 1).getDay();
      const lastDate = new Date(viewYear, viewMonth, 0).getDate();
      const prevLastDate = new Date(viewYear, viewMonth - 1, 0).getDate();

      // 앞쪽 빈칸 (지난달)
      for (let i = firstDay - 1; i >= 0; i--) {
        addDateCell(prevLastDate - i, "other-month");
      }

      // 이번 달 날짜
      for (let d = 1; d <= lastDate; d++) {
        const dateStr = `${viewYear}-${String(viewMonth).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
        const dayOfWeek = new Date(viewYear, viewMonth - 1, d).getDay();
        const cellDate = parseDate(dateStr);   // 실제 Date 객체로 변환 (비교용)

        // 과거(오늘 이전) 판정을 가장 먼저 → sun/booked보다 우선
        let cls = "";
        if (cellDate < TODAY) {
          cls = "past";                         // 어제 이전 → 회색 + 클릭 불가
        } else if (BOOKED.includes(dateStr)) {
          cls = "booked";
        } else if (dayOfWeek === 0) {
          cls = "sun";
        }

        // 선택 범위 표시
        if (startDate && endDate && dateStr >= startDate && dateStr <= endDate) {
          cls += " in-range";
          if (dateStr === startDate) cls += " range-start";
          if (dateStr === endDate) cls += " range-end";
        } else if (startDate && dateStr === startDate) {
          cls += " in-range range-start";
        }

        addDateCell(d, cls, dateStr);
      }

      // 뒤쪽 빈칸 (다음달)
      const remain = 42 - (firstDay + lastDate);
      for (let d = 1; d <= remain; d++) {
        addDateCell(d, "other-month");
      }

      // 이전 달 버튼 활성/비활성 갱신
      updateNavButtons();
    }

    // 날짜 칸 하나 만들기
    function addDateCell(num, cls, dateStr) {
      const el = document.createElement("div");
      el.className = "cal-date " + cls;
      el.textContent = num;

      if (dateStr && !cls.includes("booked") && !cls.includes("other-month") && !cls.includes("past")) {
        el.addEventListener("click", () => handleDateClick(dateStr));
      }

      calendarEl.appendChild(el);
    }

    // 날짜 클릭 처리
    function handleDateClick(dateStr) {
      // 방어: 과거(오늘 이전) 날짜는 선택 차단 (Date 객체로 비교)
      if (parseDate(dateStr) < TODAY) return;

      // 아직 시작일 없음 or 이미 범위 완성 → 새로 시작
      if (!startDate || endDate) {
        startDate = dateStr;
        endDate = null;
      }
      // ★ 시작일과 "같은 날짜" 재클릭 → 선택 취소 (초기 상태로 복귀).
      //   startDate 있고 endDate 없는 상태에서만 동작.
      else if (dateStr === startDate) {
        startDate = null;
        endDate = null;
      }
      // 시작일보다 앞 → 시작일 교체
      else if (dateStr < startDate) {
        startDate = dateStr;
      }
      // 끝일 선택
      else {
        const nights = countNights(startDate, dateStr);

        if (nights >= MAX_NIGHTS) {
          openModal(`최대 ${MAX_NIGHTS - 1}박까지 예약 가능합니다.`);
          startDate = null;
          endDate = null;
        } else if (hasBookedBetween(startDate, dateStr)) {
          openModal("선택 구간에 예약완료된 날짜가 있습니다.");
          startDate = null;
          endDate = null;
        } else {
          endDate = dateStr;
        }
      }

      renderCalendar();
      updateTotal();
    }

    // 두 날짜 사이 박 수 (밀리초 차이 ÷ 하루)
    function countNights(a, b) {
      const d1 = new Date(a);
      const d2 = new Date(b);
      return (d2 - d1) / (1000 * 60 * 60 * 24);
    }

    // 구간에 예약완료 날짜가 끼어있는지
    function hasBookedBetween(a, b) {
      return BOOKED.some(d => d > a && d <= b);
    }

    // 이전/다음 달 버튼
    const prevBtnEl = document.getElementById("prevBtn");
    const nextBtnEl = document.getElementById("nextBtn");

    function isThisMonth() {
      return viewYear === TODAY.getFullYear() && viewMonth === TODAY.getMonth() + 1;
    }

    function updateNavButtons() {
      // 입실·퇴실 모두 선택됨 → 양쪽 버튼 모두 이동 금지
      if (startDate && endDate) {
        prevBtnEl.disabled = true;
        nextBtnEl.disabled = true;
        return;
      }
      // 현재 보는 달이 이번 달(오늘이 속한 달)이면 더 과거로 못 가게 비활성화
      prevBtnEl.disabled = isThisMonth();
      nextBtnEl.disabled = false;
    }

    prevBtnEl.addEventListener("click", () => {
      // 체크인·체크아웃 모두 선택됨 → 이동 금지
      if (startDate && endDate) return;
      if (isThisMonth()) return;   // 안전장치: 이번 달이면 이동 금지
      viewMonth--;
      if (viewMonth < 1) { viewMonth = 12; viewYear--; }
      renderCalendar();
    });

    nextBtnEl.addEventListener("click", () => {
      // 체크인·체크아웃 모두 선택됨 → 이동 금지
      if (startDate && endDate) return;
      viewMonth++;
      if (viewMonth > 12) { viewMonth = 1; viewYear++; }
      renderCalendar();
    });


    // ========== 5. 총 합계 (박 수 × 가격) ==========
    const extraPersonEl = document.getElementById("extraPerson");
    const totalPriceEl = document.getElementById("totalPrice");

    function updateTotal() {
      // 날짜가 둘 다 선택되어야 계산, 아니면 0원(취소/초기 상태)
      if (!startDate || !endDate) {
        totalPriceEl.textContent = "0";
        return;
      }

      const extra = Number(extraPersonEl.value);   // 추가 인원 수

      // 체크인 ~ 체크아웃 전날까지(체크아웃 제외) 각 날짜 요금 합산
      let total = 0;
      const cur = new Date(startDate);
      const last = new Date(endDate);   // 이 날은 포함하지 않음
      for (let i = 0; cur < last; i++) {
        let dayPrice = priceByDay(cur);
        dayPrice += dayPrice * 0.2 * extra;   // 추가 인원: 각 날짜 요금의 20% × 인원
        total += dayPrice;
        cur.setDate(cur.getDate() + 1);       // 다음 날로 이동
      }

      totalPriceEl.textContent = total.toLocaleString();
    }

    extraPersonEl.addEventListener("change", updateTotal);


    // ========== 6. 취소 버튼 (선택 초기화) ==========
    document.getElementById("cancelBtn").addEventListener("click", () => {
      startDate = null;
      endDate = null;
      extraPersonEl.value = "0";
      renderCalendar();
      updateTotal();
    });


    // ========== 7. 모달 ==========
    const modalBackdrop = document.getElementById("modalBackdrop");
    const modalMsg = document.getElementById("modalMsg");

    function openModal(msg) {
      modalMsg.textContent = msg;
      modalBackdrop.style.display = "flex";
    }

    document.getElementById("modalConfirm").addEventListener("click", () => {
      modalBackdrop.style.display = "none";
    });


    // 페이지 열리면 실행 — 객실 정보·예약 날짜 불러오고 캘린더 렌더
    // loadRoom 이 슬라이드를 채운 경우에만 startRoomSwiper 로 Swiper 초기화.
    // (슬라이드가 비었으면 Swiper 초기화를 건너뛴다 — 빈 상태 초기화 시 사진이 안 보이는 원인 방지)
    (async () => {
      const [roomLoaded] = await Promise.all([loadRoom(), loadBooked()]);
      if (roomLoaded) startRoomSwiper();
      renderCalendar();
      updateTotal();
    })();

    // 예약하기 → reservation4로 정보 넘기기 (room_id 추가)
    document.querySelector(".btn-submit").addEventListener("click", () => {
      if (!startDate || !endDate) {
        openModal("날짜를 선택해 주세요.");
        return;
      }

      const params = new URLSearchParams({
        room: "PREMIUM",
        room_id: ROOM_ID,           // db 저장용 room_id
        extra: extraPersonEl.value,
        start: startDate,
        end: endDate,
        total: totalPriceEl.textContent
      });

      window.location.href = "reservation4.html?" + params.toString();
    });
  </script>
