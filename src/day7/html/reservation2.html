<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>호텔 - 실시간예약</title>

  <!-- 공통 CSS (header / footer / to-top / 기본초기화) -->
  <link rel="stylesheet" href="common.css">

  <style>
    /* ========== 반응형 (1000px 이하) — 페이지 고유 규칙만 ==========
       header 반응형은 common.css로 이동. */
    @media (max-width: 1000px) {
      .info-row { flex-direction: column; }
    }


    /* ========== 배너 ========== */
    .hero {
      width: 100%;
      aspect-ratio: 2000 / 400;   /* Figma 시안 비율 */
      position: relative;
    }

    .hero-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    /* 사진 위 어두운 막 (검정 20%) - 글자 잘 보이게 */
    .hero::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.2);
      z-index: 1;
    }

    .hero-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      text-align: center;
      z-index: 5;   /* 어두운 막보다 위에 */
    }

    .hero-title {
      font-size: 2rem;
      letter-spacing: 3px;
      margin-bottom: 10px;
    }

    .hero-desc {
      font-size: 0.95rem;
      letter-spacing: 1px;
    }


    /* ========== 섹션 공통 ========== */
    .section {
      max-width: 1440px;
      margin: 0 auto;
      padding: 80px 20px;
      text-align: center;
    }

    .section-title {
      font-size: 32px;
      letter-spacing: 4px;
      margin-bottom: 40px;
    }


    /* ========== 객실 선택 (띠 4개) ========== */
    .room-list {
      margin-bottom: 60px;
    }

    /* 띠 하나 = 사진 + 글자 */
    .room-item {
      display: block;
      position: relative;        /* 글자(absolute)의 기준점 */
      width: 100%;
       aspect-ratio: 1316 / 266;  /* 가로로 긴 띠 비율 */
      overflow: hidden;          /* hover 확대 시 삐져나온 부분 자르기 */
    }

    .room-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s;
    }

    /* 마우스 올리면 사진 살짝 확대 */
    .room-item:hover img {
      transform: scale(1.05);
    }

    /* 사진 위에 얹히는 글자 */
    .room-label {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      gap: 20px;
      color: #fff;
      z-index: 2;
    }

    .room-name {
      font-size: 36px;
      letter-spacing: 2px;
    }

    /* 화살표 - 가로선 하나 */
    .room-arrow {
      display: inline-block;
      width: 100px;
      height: 1px;
      background: #fff;
      position: relative;
    }

    /* 화살표 촉 (>) - 45도 회전시킨 모서리 */
    .room-arrow::after {
      content: "";
      position: absolute;
      right: 0;
      top: -4px;
      width: 10px;
      height: 10px;
      border-top: 1px solid #fff;
      border-right: 1px solid #fff;
      transform: rotate(45deg);
    }


    /* ========== 취소 및 환불규정 ========== */
    .policy {
      border: 1px solid #d8d8d8;
      text-align: left;
    }

    .policy-title {
      background: #d4d4d4;
      font-size: 15px;
      font-weight: normal;
      padding: 14px 20px;
    }

    .policy-body {
      padding: 24px 20px;
    }

    .policy-body p {
      font-size: 14px;
      line-height: 2.2;
      color: #444;
    }
    .room-item::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.15);
  z-index: 1;
}
  </style>
</head>

<body>

  <!-- ===== 헤더 (Web Component) ===== -->
  <my-header></my-header>


  <!-- ===== RESERVATION 배너 ===== -->
  <div class="hero">
    <img class="hero-img" src="image/reservation2.jpg" alt="실시간예약 배너">
    <div class="hero-text">
      <h2 class="hero-title">RESERVATION</h2>
      <p class="hero-desc">실시간예약</p>
    </div>
  </div>


  <!-- ===== 객실 선택 ===== -->
  <section class="section">
    <h2 class="section-title">객실 선택</h2>

    <div class="room-list">
      <a href="reservation3.html" class="room-item">
        <img src="image/room-standard.jpg" alt="스탠다드">
        <div class="room-label">
          <span class="room-name">STANDARD</span>
          <span class="room-arrow"></span>
        </div>
      </a>

      <a href="reservation3-2.html" class="room-item">
        <img src="image/room-deluxe.jpg" alt="디럭스">
        <div class="room-label">
          <span class="room-name">DELUXE</span>
          <span class="room-arrow"></span>
        </div>
      </a>

       <a href="reservation3-3.html" class="room-item">
        <img src="image/room-premium.jpg" alt="프리미엄">
        <div class="room-label">
          <span class="room-name">PREMIUM</span>
          <span class="room-arrow"></span>
        </div>
      </a>

       <a href="reservation3-4.html" class="room-item">
        <img src="image/room-sweet.jpg" alt="스위트">
        <div class="room-label">
          <span class="room-name">SWEET</span>
          <span class="room-arrow"></span>
        </div>
      </a>
    </div>

    <!-- 취소 및 환불규정 -->
    <div class="policy">
      <h3 class="policy-title">취소 및 환불 규정</h3>
      <div class="policy-body">
        <p>숙박 예정일 1일 전 18시까지는 위약금 없이 취소 및 변경이 가능합니다.</p>
        <p>숙박 예정일 1일 전 18시 이후 취소/변경 및 노쇼(No-show) 발생 시,</p>
        <p>- 성수기 : 최초 1일 숙박 요금의 80%가 위약금으로 부과됩니다.</p>
        <p>- 비수기(성수기 외 기간) : 최초 1일 숙박 요금의 10%가 위약금으로 부과됩니다.</p>
        <p>일부 패키지의 경우 별도의 취소규정이 적용됩니다.</p>
      </div>
    </div>
  </section>


  <!-- ===== 푸터 (Web Component) ===== -->
  <my-footer></my-footer>


  <!-- ===== 맨 위로 버튼 (Web Component) ===== -->
  <my-to-top></my-to-top>


  <!-- Web Components: 헤더(모바일 메뉴/서브메뉴) + 푸터 + 맨 위로 -->
  <script src="MyHeader.js"></script>
  <script src="MyFooter.js"></script>
  <script src="MyToTop.js"></script>
<!-- 경고 모달 -->

</body>
</html>
