<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>호텔 - 예약 등록</title>

  <!-- 공통 CSS (header / footer / to-top / 기본초기화) -->
  <link rel="stylesheet" href="common.css">

  <style>
    /* 페이지 고유 규칙 (초기화/header/footer/to-top은 common.css로 이동) */
    button { font-family: inherit; cursor: pointer; }
    input, select { font-family: inherit; }


    /* ========== 배너 ========== */
    .hero {
      width: 100%;
      aspect-ratio: 2000 / 400;
      position: relative;
    }

    .hero-img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .hero::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.2);
      z-index: 1;
    }

    .hero-text {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      text-align: center;
      z-index: 5;
    }

    .hero-title { font-size: 2rem; letter-spacing: 3px; margin-bottom: 10px; }
    .hero-desc { font-size: 0.95rem; letter-spacing: 1px; }


    /* ========== 섹션 ========== */
    .section {
      max-width: 1440px;
      margin: 0 auto;
      padding: 80px 20px;
    }

    .section-title {
      font-size: 24px;
      letter-spacing: 2px;
      text-align: center;
      margin-bottom: 50px;
      font-weight: normal;
    }


    /* ========== 좌우 2단 ========== */
    .detail-row {
      display: flex;
      gap: 60px;
    }

    .detail-left { flex: 1; }
    .detail-right { flex: 1; }


    /* ---------- 왼쪽: 입력 폼 ---------- */
    .form-row {
      display: flex;
      align-items: flex-start;
      margin-bottom: 20px;
    }

    .form-label {
      width: 90px;
      font-size: 14px;
      padding-top: 10px;
      flex-shrink: 0;
    }

    .form-field { flex: 1; }

    .form-field input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      font-size: 13px;
    }

    /* 읽기 전용 칸 (ROOM, 추가인원) - 회색 */
    .form-field input[readonly] {
      background: #eee;
      border-color: #eee;
      color: #666;
    }

    /* 필수 입력 안 됐을 때 빨간 테두리 */
    .form-field input.error {
      border-color: #e74c3c;
    }

    /* 에러 메시지 */
    .error-msg {
      display: none;              /* 평소엔 숨김 */
      font-size: 12px;
      color: #e74c3c;
      margin-top: 6px;
    }

    .error-msg.show { display: block; }


    /* 총 합계 */
    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 40px;
      padding-top: 20px;
    }

    .total-label { font-size: 14px; }
    .total-price { font-size: 18px; font-weight: bold; }


    /* 버튼 */
    .btn-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 50px;
    }

    .btn {
      width: 150px;
      padding: 14px;
      font-size: 14px;
      border: 1px solid #ddd;
    }

    .btn-cancel { background: #fff; color: #333; }

    .btn-submit {
      background: #2b2b2b;
      color: #fff;
      border-color: #2b2b2b;
    }

    .btn-submit:hover { background: #444; }


    /* ---------- 오른쪽: 달력 (읽기 전용) ---------- */
    .cal-header {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 20px;
      margin-bottom: 20px;
    }

    .cal-btn { background: none; border: none; font-size: 16px; color: #666; }
    .cal-title { font-size: 14px; }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      border-bottom: 1px solid #ddd;
      padding-bottom: 20px;
    }

    .cal-day-name { font-size: 12px; padding: 10px 0; color: #333; }
    .cal-day-name.sun { color: #e74c3c; }

    .cal-date {
      font-size: 12px;
      padding: 10px 0;
      position: relative;
      cursor: default;             /* 여긴 클릭 안 됨 (읽기 전용) */
    }

    .cal-date.other-month { color: #ccc; }
    .cal-date.sun { color: #e74c3c; }

    .cal-date.booked { color: #e74c3c; }

    .cal-date.booked::after {
      content: "예약완료";
      display: block;
      font-size: 8px;
      margin-top: 2px;
    }

    /* 선택된 범위 (초록) */
    .cal-date.in-range { background: #22c55e; color: #fff; }

    .cal-date.range-start::after {
      content: "입실";
      display: block;
      font-size: 8px;
      margin-top: 2px;
    }

    .cal-date.range-end::after {
      content: "퇴실";
      display: block;
      font-size: 8px;
      margin-top: 2px;
    }


    /* ---------- 모달 ---------- */
    .modal-backdrop {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .modal {
      background: #fff;
      width: 420px;
      padding: 50px 40px 30px;
      text-align: center;
    }

    .modal p { font-size: 15px; margin-bottom: 30px; }

    .modal button {
      background: #2b2b2b;
      color: #fff;
      border: none;
      padding: 12px 30px;
      font-size: 13px;
    }


    /* ========== 반응형 (1000px 이하) — 페이지 고유 규칙만 ==========
       header 반응형은 common.css로 이동. */
    @media (max-width: 1000px) {
      .detail-row { flex-direction: column; }
    }
  </style>
</head>

<body>

  <!-- ===== 헤더 (공통 컴포넌트로 불러옴) ===== -->
  <div id="header-slot"></div>


  <!-- ===== 배너 ===== -->
  <div class="hero">
    <img class="hero-img" src="image/reservation2.jpg" alt="실시간예약 배너">
    <div class="hero-text">
      <h2 class="hero-title">RESERVATION</h2>
      <p class="hero-desc">실시간예약</p>
    </div>
  </div>


  <!-- ===== 예약 등록 ===== -->
  <section class="section">
    <h2 class="section-title">예약 등록</h2>

    <div class="detail-row">

      <!-- 왼쪽: 입력 폼 -->
      <div class="detail-left">

        <!-- ROOM (읽기 전용) -->
        <div class="form-row">
          <span class="form-label">ROOM</span>
          <div class="form-field">
            <input type="text" id="roomName" value="STANDARD" readonly>
          </div>
        </div>

        <!-- 추가인원 (읽기 전용) -->
        <div class="form-row">
          <span class="form-label">추가인원</span>
          <div class="form-field">
            <input type="text" id="extraCount" value="0" readonly>
          </div>
        </div>

        <!-- 예약명 (필수) -->
        <div class="form-row">
          <span class="form-label">예약명</span>
          <div class="form-field">
            <input type="text" id="guestName" placeholder="예약명을 입력해 주세요.">
            <p class="error-msg" id="nameError">필수 입력 값입니다.</p>
          </div>
        </div>

        <!-- 전화번호 (필수 + 형식 검사) -->
        <div class="form-row">
          <span class="form-label">전화번호</span>
          <div class="form-field">
            <input type="text" id="guestPhone" placeholder="-를 제외하고 입력해 주세요.">
            <p class="error-msg" id="phoneError">필수 입력 값입니다.</p>
          </div>
        </div>

        <!-- 총 합계 -->
        <div class="total-row">
          <span class="total-label">총 합계</span>
          <span><span class="total-price" id="totalPrice">150,000</span> 원</span>
        </div>

        <!-- 버튼 -->
        <div class="btn-row">
          <button class="btn btn-cancel" id="cancelBtn">취소</button>
          <button class="btn btn-submit" id="submitBtn">예약하기</button>
        </div>

      </div>

      <!-- 오른쪽: 달력 (선택된 날짜 확인용, 읽기 전용) -->
      <div class="detail-right">
        <div class="cal-header">
          <button class="cal-btn" id="prevBtn">&lt;</button>
          <span class="cal-title" id="calTitle">2025년 05월</span>
          <button class="cal-btn" id="nextBtn">&gt;</button>
        </div>

        <div class="calendar" id="calendar"></div>
      </div>

    </div>
  </section>


  <!-- ===== 푸터 (공통 컴포넌트로 불러옴) ===== -->
  <div id="footer-slot"></div>


  <!-- ===== 맨 위로 버튼 (공통 컴포넌트로 불러옴) ===== -->
  <div id="to-top-slot"></div>


  <!-- ===== 예약완료 모달 ===== -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <p id="modalMsg">예약이 완료되었습니다.</p>
      <button id="modalConfirm">확인</button>
    </div>
  </div>


  <!-- 공통 스크립트: 컴포넌트 로드 + 모바일 메뉴 + 맨 위로 버튼 -->
  <script src="common.js"></script>

  <script>
    // (모바일 메뉴 / 맨 위로 버튼 로직은 common.js로 이동)


    // ========== 1. 앞 페이지에서 넘어온 정보 받기 ==========
    // 주소창의 ?room=STANDARD&extra=0&start=... 부분을 읽어옴
    const params = new URLSearchParams(window.location.search);

    const roomName = params.get("room") || "STANDARD";
    const extraCount = params.get("extra") || "0";
    const startDate = params.get("start") || null;
    const endDate = params.get("end") || null;
    const totalPrice = params.get("total") || "150,000";

    document.getElementById("roomName").value = roomName;
    document.getElementById("extraCount").value = extraCount;
    document.getElementById("totalPrice").textContent = totalPrice;


    // ========== 2. 달력 (읽기 전용 - 선택된 날짜만 표시) ==========
    const BOOKED = ["2025-05-20", "2025-05-21", "2025-05-29", "2025-05-30", "2025-05-31"];

    let viewYear = startDate ? Number(startDate.slice(0, 4)) : 2025;
    let viewMonth = startDate ? Number(startDate.slice(5, 7)) : 5;

    const calendarEl = document.getElementById("calendar");
    const calTitleEl = document.getElementById("calTitle");
    const dayNames = ["일", "월", "화", "수", "목", "금", "토"];

    function renderCalendar() {
      calendarEl.innerHTML = "";
      calTitleEl.textContent = `${viewYear}년 ${String(viewMonth).padStart(2, "0")}월`;

      dayNames.forEach((name, i) => {
        const el = document.createElement("div");
        el.className = "cal-day-name" + (i === 0 ? " sun" : "");
        el.textContent = name;
        calendarEl.appendChild(el);
      });

      const firstDay = new Date(viewYear, viewMonth - 1, 1).getDay();
      const lastDate = new Date(viewYear, viewMonth, 0).getDate();
      const prevLastDate = new Date(viewYear, viewMonth - 1, 0).getDate();

      for (let i = firstDay - 1; i >= 0; i--) {
        addDateCell(prevLastDate - i, "other-month");
      }

      for (let d = 1; d <= lastDate; d++) {
        const dateStr = `${viewYear}-${String(viewMonth).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
        const dayOfWeek = new Date(viewYear, viewMonth - 1, d).getDay();

        let cls = "";
        if (BOOKED.includes(dateStr)) cls = "booked";
        else if (dayOfWeek === 0) cls = "sun";

        // 앞 페이지에서 선택한 범위 표시
        if (startDate && endDate && dateStr >= startDate && dateStr <= endDate) {
          cls += " in-range";
          if (dateStr === startDate) cls += " range-start";
          if (dateStr === endDate) cls += " range-end";
        }

        addDateCell(d, cls);
      }

      const remain = 42 - (firstDay + lastDate);
      for (let d = 1; d <= remain; d++) {
        addDateCell(d, "other-month");
      }
    }

    function addDateCell(num, cls) {
      const el = document.createElement("div");
      el.className = "cal-date " + cls;
      el.textContent = num;
      calendarEl.appendChild(el);
    }

    document.getElementById("prevBtn").addEventListener("click", () => {
      viewMonth--;
      if (viewMonth < 1) { viewMonth = 12; viewYear--; }
      renderCalendar();
    });

    document.getElementById("nextBtn").addEventListener("click", () => {
      viewMonth++;
      if (viewMonth > 12) { viewMonth = 1; viewYear++; }
      renderCalendar();
    });


    // ========== 3. 유효성 검사 ==========
    const nameInput = document.getElementById("guestName");
    const phoneInput = document.getElementById("guestPhone");
    const nameError = document.getElementById("nameError");
    const phoneError = document.getElementById("phoneError");

    // 전화번호 형식 (숫자 10~11자리)
    const PHONE_REGEX = /^01[0-9]{8,9}$/;

    function validateForm() {
      let ok = true;

      // 예약명 검사
      if (nameInput.value.trim() === "") {
        nameInput.classList.add("error");
        nameError.textContent = "필수 입력 값입니다.";
        nameError.classList.add("show");
        ok = false;
      } else {
        nameInput.classList.remove("error");
        nameError.classList.remove("show");
      }

      // 전화번호 검사
      if (phoneInput.value.trim() === "") {
        phoneInput.classList.add("error");
        phoneError.textContent = "필수 입력 값입니다.";
        phoneError.classList.add("show");
        ok = false;
      } else if (!PHONE_REGEX.test(phoneInput.value.trim())) {
        phoneInput.classList.add("error");
        phoneError.textContent = "올바른 전화번호 형식이 아닙니다. (예: 01012345678)";
        phoneError.classList.add("show");
        ok = false;
      } else {
        phoneInput.classList.remove("error");
        phoneError.classList.remove("show");
      }

      return ok;
    }


    // ========== 4. 예약하기 ==========
    const modalBackdrop = document.getElementById("modalBackdrop");

    // 예약 날짜(체크인 ~ 체크아웃 전날, 체크아웃 제외)를 localStorage에 저장
    // → reservation3 계열에서 새로고침 시 "예약완료" 표시 + 클릭 차단으로 유지됨
    function saveBookedDates(room, start, end) {
      if (!room || !start || !end) return;          // 정보 부족 시 저장 안 함

      const key = "booked_" + room;                  // 객실별 키 (booked_STANDARD 등)
      const dates = [];

      // 체크인 ~ 체크아웃 전날까지 순회 (체크아웃일은 제외)
      const cur = new Date(start);
      const last = new Date(end);
      while (cur < last) {
        const y = cur.getFullYear();
        const m = String(cur.getMonth() + 1).padStart(2, "0");
        const d = String(cur.getDate()).padStart(2, "0");
        dates.push(`${y}-${m}-${d}`);
        cur.setDate(cur.getDate() + 1);
      }

      // 기존 저장된 예약과 합쳐서 중복 제거 후 저장
      let existing = [];
      try {
        const raw = localStorage.getItem(key);
        existing = raw ? JSON.parse(raw) : [];
      } catch (e) {
        existing = [];
      }
      const merged = Array.from(new Set([...existing, ...dates]));
      localStorage.setItem(key, JSON.stringify(merged));
    }

    document.getElementById("submitBtn").addEventListener("click", () => {
      if (validateForm()) {
        // 최종 예약 완료 → 날짜 저장 (새로고침 후에도 예약완료로 유지)
        saveBookedDates(roomName, startDate, endDate);
        modalBackdrop.style.display = "flex";   // 완료 모달
      }
    });

    // 모달 확인 → 홈으로
    document.getElementById("modalConfirm").addEventListener("click", () => {
      modalBackdrop.style.display = "none";
      window.location.href = "HOME.html";
    });


    // ========== 5. 취소 → 금액 0원 초기화 후 이전 페이지로 ==========
    document.getElementById("cancelBtn").addEventListener("click", () => {
      // 총 합계 금액을 0원으로 초기화
      document.getElementById("totalPrice").textContent = "0";
      // 관련 state/입력값도 함께 리셋
      const extraEl = document.getElementById("extraCount");
      if (extraEl) extraEl.value = "0";
      history.back();
    });


    renderCalendar();
  </script>

</body>
</html>
