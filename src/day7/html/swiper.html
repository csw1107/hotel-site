<!DOCTYPE html>
<html lang="ko">
<head>
    <!-- CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .swiper {
  width: 100%;
  height: 66vh;
}
.swiper-slide {
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 100px;
  color: white;
}
    </style>
</head>
<body>
    <div class="swiper mySwiper">
  <div class="swiper-wrapper">
    <div class="swiper-slide" style="background-color: red">Slide 1</div>
    <div class="swiper-slide" style="background-color: pink">Slide 2</div>
    ...
  </div>
  <div class="swiper-pagination"></div>  <!-- 페이지 점 -->
</div>
    <script>
        var swiper = new Swiper(".mySwiper", {
  loop: true,           // 마지막 슬라이드 다음에 다시 처음으로 돌아감
  pagination: {
    el: ".swiper-pagination",
    clickable: true,    // 하단 점을 클릭해서 이동 가능
  },
  autoplay: {
    delay: 2000,               // 2000ms(2초)마다 자동으로 다음 슬라이드로
    disabledOnInteraction: false,  // 사용자가 직접 넘겨도 자동재생 안 멈춤
  },
});
    </script>
</body>
</html>
